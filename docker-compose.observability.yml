  
# Optional add-on for the Redis-vs-DB latency benchmark (see docs/decision/005-redis-vs-db-latency-benchmark.md).
# The app itself keeps running from IntelliJ on the host, not in this compose file; these two
# services just scrape/visualize the Micrometer metrics it already exposes on /actuator/prometheus.
#
# Usage:
#   source scripts/load-env.sh && ./scripts/render-prometheus-config.sh   # writes prometheus.yml
#                                                                          # for the current SERVER_PORT
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Grafana: http://localhost:3000 (admin/admin), datasource + dashboard are pre-provisioned.

services:
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container scrape the Spring Boot app running on the host machine (IntelliJ).
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:12.4.0
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
