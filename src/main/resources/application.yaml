spring:
  application:
    name: chatbot
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  session:
    store-type: redis
    timeout: 30m
app:
  llm:
    provider: gemini
  conversation:
    cache:
      ttl-min: 30
      max-msg: 10