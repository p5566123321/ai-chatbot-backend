spring:
  application:
    name: chatbot
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  session:
    store-type: redis
    timeout: 30m
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
app:
  llm:
    # gemini (default) or fake — fake is a no-external-call LlmProvider for load-testing the
    # queue pipeline without real LLM latency/cost, see FakeLlmProvider.
    provider: ${LLM_PROVIDER:gemini}
    gemini:
      model: ${GEMINI_MODEL}
      timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
    fake:
      chunk-delay-ms: ${FAKE_LLM_CHUNK_DELAY_MS:20}
  sse:
    timeout-ms: ${SSE_TIMEOUT_MS:60000}
  conversation:
    cache:
      enabled: ${CONVERSATION_CACHE_ENABLED:true}
      ttl-min: 30
      max-msg: 10
  queue:
    max-attempts: 3
    block-timeout-ms: 5000
    reclaim-idle-ms: 30000