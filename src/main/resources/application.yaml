spring:
  application:
    name: chatbot
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  session:
    store-type: redis
    timeout: 30m
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
app:
  llm:
    provider: gemini
    gemini:
      model: ${GEMINI_MODEL}
      timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
  sse:
    timeout-ms: ${SSE_TIMEOUT_MS:60000}
  conversation:
    cache:
      ttl-min: 30
      max-msg: 10